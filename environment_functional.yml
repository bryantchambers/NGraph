name: ngraph-functional
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - kofamscan=1.3.0
  - hmmer=3.4
  - ruby
  - parallel
  - r-base=4.5
  - bioconductor-gsva
  - bioconductor-fgsea
  - pandas
  - numpy
  - scipy
  - matplotlib
# Resolve explicitly after user authorization, then save an explicit package
# lock beside the reference snapshot. This environment does not replace ngraph.

# eggNOG 2.1.14 uses its own environment because its pinned DIAMOND/zlib
# dependencies conflict with modern R: environment_functional_eggnog.yml.
